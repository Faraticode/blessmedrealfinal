<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — BlessMed</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">Bless<span class="dot">Med</span></a>
  </nav>

  <div class="auth-wrapper">
    <div class="card auth-card">
      <h2>Create your account</h2>
      <div id="alert-box"></div>
      <form id="signup-form">
        <div class="field-row">
          <div>
            <label for="firstName">First name</label>
            <input type="text" id="firstName" required />
          </div>
          <div>
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" required />
          </div>
        </div>
        <div>
          <label for="otherNames">Other names <span class="muted">(optional)</span></label>
          <input type="text" id="otherNames" />
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" />
        </div>
        <div>
          <label for="wallet">Wallet address <span class="muted">(optional)</span></label>
          <input type="text" id="wallet" placeholder="ST1... (Stacks wallet, optional)" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
      <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script src="js/api.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
</body>
</html>
